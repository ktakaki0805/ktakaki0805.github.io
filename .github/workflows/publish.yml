# main に push すると、サイトを書き出して GitHub Pages に公開する。
# 初回だけ、リポジトリの Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」にしておくこと。
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise.toml に書いた版の Quarto を入れる
      - uses: jdx/mise-action@v5

      - name: Render
        run: mise run render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
